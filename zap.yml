# Zap dependency manifest
schema: 5

project:
  name: zap-hub
  environment: pico-sdk
  target: Hub
  board: pico2_w
  build_dir: build
  deps_dir: deps
  adapters_dir: adapters

build:
  configuration: Release

upload:
  default: auto
  order:
    - openocd
    - bootsel
    - picotool
  methods:
    bootsel:
      type: volume-copy
      artifact: "{build_dir}/{target}.uf2"
      volume_labels:
        - RP2350
        - RPI-RP2
    openocd:
      type: command
      artifact: "{build_dir}/{target}.elf"
      executable: openocd
      search:
        - PATH
        - "{pico_home}/openocd"
      variables:
        probe_serial: env:ZAP_PROBE_SERIAL
        adapter_speed_khz: 5000
      find:
        scripts:
          root: "{pico_home}/openocd"
          file: rp2350.cfg
          parent: 2
      args:
        - -s
        - "{scripts}"
        - -f
        - interface/cmsis-dap.cfg
        - "{?probe_serial}"
        - -f
        - target/rp2350.cfg
        - -c
        - "adapter speed {adapter_speed_khz}"
        - -c
        - "program \"{artifact}\" verify reset exit"
      optional_args:
        probe_serial:
          - -c
          - "adapter serial {probe_serial}"
    picotool:
      type: command
      artifact: "{build_dir}/{target}.uf2"
      executable: picotool
      search:
        - PATH
        - "{pico_home}/picotool"
      variables:
        serial: env:ZAP_PICO_SERIAL
      args:
        - load
        - -f
        - -v
        - -x
        - "{artifact}"
      optional_args:
        serial:
          - --ser
          - "{serial}"
          
dependencies:
  zapee:
    type: path
    uri: ../ZapEE
    zephyr_module: true
    components:
      - zap::ztm_pwm
      - zap::ztm_adc
      - zap::ztm_stepper
      - zap::ztm_psu_hv
      - zap::ztm_psu_tec
      - zap::pico_ztpico2
      - zap::pico_ztpico2_ztm_psu_tec
      - zap::pico_ztpico2_ztm_pwm
      - zap::pico_ztpico2_ztm_adc
      - zap::pico_ztpico2_ztm_stepper
      - zap::registry
      - zap::cli
      - zap::pico_log
      - zap::pico_network
  pico-sdk:
    type: git
    uri: https://github.com/raspberrypi/pico-sdk.git
    version: 2.3.0
    components:
